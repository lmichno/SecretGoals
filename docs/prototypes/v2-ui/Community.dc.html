<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Społeczność – mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
a{color:#8BE5B8}a:hover{color:#B9F0D2}
.sg-feed::-webkit-scrollbar{display:none}
.sg-feed{scrollbar-width:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #F3F1EC; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">

  <div class="sg-feed" style="height: 844px; overflow-y: auto; scroll-snap-type: y mandatory">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <article style="{{it.cardStyle}}">
        <div style="display: flex; flex-direction: column; gap: 14px; padding-right: 68px">
          <span style="{{it.tagStyle}}">{{it.tag}}</span>

          <sc-if value="{{it.hasBig}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; align-items: baseline; gap: 10px">
              <span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 96px; line-height: 0.9; font-weight: 800; letter-spacing: -0.03em">{{it.big}}</span>
              <span style="font-size: 18px; color: #DAD7D0">{{it.bigUnit}}</span>
            </div>
          </sc-if>

          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 28px; line-height: 1.12; font-weight: 700">{{it.title}}</h2>
          <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #DAD7D0">{{it.body}}</p>

          <sc-if value="{{it.hasSteps}}" hint-placeholder-val="{{ false }}">
            <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
              <sc-for list="{{it.steps}}" as="st" hint-placeholder-count="3">
                <li style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.45">
                  <span style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 9px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">{{st.n}}</span>
                  <span>{{st.text}}</span>
                </li>
              </sc-for>
            </ol>
          </sc-if>

          <sc-if value="{{it.hasProgress}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <div style="height: 8px; border-radius: 999px; background: rgba(255,255,255,0.14); overflow: hidden">
                <div style="{{it.barStyle}}"></div>
              </div>
              <span style="font-size: 13px; color: #DAD7D0">{{it.progressLabel}}</span>
            </div>
          </sc-if>

          <div style="display: flex; align-items: center; gap: 10px; margin-top: 6px">
            <div style="width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0">{{it.initials}}</div>
            <div style="display: flex; flex-direction: column">
              <span style="font-size: 15px; font-weight: 600">{{it.alias}}</span>
              <span style="font-size: 12px; color: #C9CED8">{{it.meta}}</span>
            </div>
          </div>
        </div>

        <div style="position: absolute; right: 12px; bottom: 120px; display: flex; flex-direction: column; gap: 14px; align-items: center">
          <button onClick="{{it.toggle}}" aria-label="Wspieram" style="{{it.supportStyle}}">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="{{it.heartFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
          </button>
          <span style="font-size: 12px; font-weight: 600; margin-top: -10px">{{it.supportCount}}</span>
          <button aria-label="Komentarze" style="width: 48px; height: 48px; border-radius: 16px; border: none; background: rgba(0,0,0,0.35); color: #F3F1EC; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>
          </button>
          <span style="font-size: 12px; font-weight: 600; margin-top: -10px">{{it.comments}}</span>
          <button aria-label="Zapisz" style="width: 48px; height: 48px; border-radius: 16px; border: none; background: rgba(0,0,0,0.35); color: #F3F1EC; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
          </button>
        </div>
      </article>
    </sc-for>
  </div>

  <div style="position: absolute; top: 0; left: 0; right: 0; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(#0F1115, rgba(15,17,21,0))">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 22px; font-weight: 700">Społeczność</span>
      <button aria-label="Napisz wpis" style="height: 40px; padding: 0 14px; border-radius: 12px; border: none; background: #5BD69B; color: #06180F; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
        <span>Wpis</span>
      </button>
    </div>
    <div role="tablist" aria-label="Filtr feedu" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Główna nawigacja" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #12151A; border-top: 1px solid #2C313A; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; min-height: 48px; text-decoration: none; color: #A3A9B5; font-size: 12px; font-weight: 500">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
      <span>Cele</span>
    </a>
    <a href="Community.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; min-height: 48px; text-decoration: none; color: #5BD69B; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <span>Społeczność</span>
    </a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; min-height: 48px; text-decoration: none; color: #A3A9B5; font-size: 12px; font-weight: 500">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>Profil</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all', supported: {} };
  }
  renderVals() {
    const s = this.state;
    const all = [
      {
        id: 'm1', type: 'milestone', bg: '#173527', tag: 'Kamień milowy · Alkohol',
        hasBig: true, big: '365', bigUnit: 'dni',
        title: 'Rok bez alkoholu',
        body: 'Pierwsze dwa tygodnie były najgorsze fizycznie. Jeśli jesteś na początku: to mija, a jasność głowy wraca szybciej, niż myślisz.',
        initials: 'AP', alias: 'Anon_Phoenix01', meta: 'automatyczny post · 15 min temu', support: 142, comments: 24
      },
      {
        id: 'g1', type: 'guide', bg: '#16273D', tag: 'Poradnik · Finanse',
        title: 'Zasada 48 godzin przy impulsywnych zakupach',
        body: 'Tak spłaciłem 12 000 zł bez poczucia, że sobie wszystkiego odmawiam.',
        hasSteps: true, steps: [
          { n: '1', text: 'Dodaj rzecz do koszyka i zamknij kartę na dwa dni.' },
          { n: '2', text: 'Po 48 godzinach zapytaj siebie, czy nadal tego chcesz.' },
          { n: '3', text: 'Kwotę, której nie wydałeś, od razu przelej na ratę.' }
        ],
        initials: 'SL', alias: 'Shadow_Lynx', meta: 'cel: spłata długu · 2 godz. temu', support: 89, comments: 11
      },
      {
        id: 'c1', type: 'checkin', bg: '#2B2238', tag: 'Meldunek · Dzień 18',
        title: '„Kawa bez papierosa zaliczona.”',
        body: 'Ciężko było ok. 14:00. Zimna woda i 10 głębokich oddechów załatwiły sprawę.',
        initials: 'AS', alias: 'Anon_Sparrow24', meta: 'cel: zero nikotyny · 40 min temu', support: 31, comments: 4
      },
      {
        id: 'n1', type: 'goal', bg: '#33261B', tag: 'Nowy cel · Sport',
        title: 'Bieganie 3 razy w tygodniu',
        body: 'Zaczynam od zera, po kontuzji kolana. Pierwszy tydzień: 3 × 20 minut marszobiegu.',
        hasProgress: true, pct: 33, progressLabel: '1 / 3 treningi w tym tygodniu',
        initials: 'NF', alias: 'Night_Falcon55', meta: 'cel jako post · wczoraj', support: 12, comments: 2
      },
      {
        id: 'g2', type: 'guide', bg: '#16273D', tag: 'Poradnik · Nałogi',
        title: 'Co robić, gdy przychodzi fala głodu',
        body: 'Głód nikotynowy trwa zwykle kilka minut. Najważniejsze, żeby go przeczekać.',
        hasSteps: true, steps: [
          { n: '1', text: 'Wstań i zmień miejsce, choćby na minutę.' },
          { n: '2', text: 'Powiedz sobie: „mogę, ale za 10 minut”.' },
          { n: '3', text: 'Napisz meldunek, nawet jedno zdanie.' }
        ],
        initials: 'GH', alias: 'Ghost_Hawk', meta: 'cel: zero nikotyny · 3 godz. temu', support: 64, comments: 9
      }
    ];
    const filter = { all: () => true, similar: (x) => x.id === 'c1' || x.id === 'g2' || x.id === 'm1', milestone: (x) => x.type === 'milestone', guide: (x) => x.type === 'guide' }[s.tab];
    const items = all.filter(filter).map((x) => {
      const on = !!s.supported[x.id];
      return {
        ...x,
        hasBig: !!x.hasBig, hasSteps: !!x.hasSteps, hasProgress: !!x.hasProgress,
        barStyle: 'height: 100%; border-radius: 999px; background: #F3F1EC; width: ' + (x.pct || 0) + '%',
        cardStyle: 'height: 844px; scroll-snap-align: start; box-sizing: border-box; padding: 120px 20px 110px; display: flex; flex-direction: column; justify-content: flex-end; position: relative; background: ' + x.bg,
        tagStyle: 'align-self: flex-start; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: rgba(0,0,0,0.3); color: #F3F1EC',
        supportCount: String(x.support + (on ? 1 : 0)),
        heartFill: on ? 'currentColor' : 'none',
        supportStyle: 'width: 48px; height: 48px; border-radius: 16px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; ' + (on ? 'background: #8AB4FF; color: #0B1626' : 'background: rgba(0,0,0,0.35); color: #F3F1EC'),
        toggle: () => this.setState({ supported: { ...s.supported, [x.id]: !on } })
      };
    });
    const tabDefs = [
      { id: 'all', label: 'Dla Ciebie' }, { id: 'similar', label: 'Podobne cele' },
      { id: 'milestone', label: 'Kamienie milowe' }, { id: 'guide', label: 'Poradniki' }
    ];
    const tabs = tabDefs.map((t) => ({
      ...t,
      on: t.id === s.tab ? 'true' : 'false',
      pick: () => this.setState({ tab: t.id }),
      style: 'flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; ' + (t.id === s.tab ? 'border: none; background: #F3F1EC; color: #0F1115; font-weight: 700' : 'border: 1px solid rgba(255,255,255,0.18); background: rgba(15,17,21,0.6); color: #DAD7D0; font-weight: 500')
    }));
    return { items, tabs };
  }
}
</script>
</body>
</html>
